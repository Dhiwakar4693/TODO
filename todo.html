<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --text-placeholder: #bdc3c7;
            --accent: #6c5ce7;
            --accent-hover: #5b4cdb;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --border: #e0e0e0;
            --shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.12);
            --todo-bg: #ffffff;
            --todo-hover: #f8f9fa;
            --completed-text: #bdc3c7;
            --filter-bg: #f0f0f0;
            --filter-active-bg: #6c5ce7;
            --filter-active-text: #ffffff;
            --drag-bg: rgba(108, 92, 231, 0.05);
            --scrollbar-track: #f0f0f0;
            --scrollbar-thumb: #ccc;
            --due-overdue: #e74c3c;
            --due-today: #f39c12;
            --due-upcoming: #27ae60;
            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-input: #1a1a2e;
            --text-primary: #ecf0f1;
            --text-secondary: #95a5a6;
            --text-placeholder: #5a6a7a;
            --accent: #a29bfe;
            --accent-hover: #6c5ce7;
            --danger: #ff6b6b;
            --danger-hover: #ee5a24;
            --success: #2ecc71;
            --border: #2d3748;
            --shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.4);
            --todo-bg: #16213e;
            --todo-hover: #1e2d4a;
            --completed-text: #4a5568;
            --filter-bg: #1a1a2e;
            --filter-active-bg: #a29bfe;
            --filter-active-text: #1a1a2e;
            --drag-bg: rgba(162, 155, 254, 0.1);
            --scrollbar-track: #1a1a2e;
            --scrollbar-thumb: #4a5568;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .theme-toggle {
            position: absolute;
            top: 5px;
            right: 0;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            transform: rotate(30deg);
            box-shadow: var(--shadow-hover);
        }

        .input-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .input-row input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .input-row input[type="text"]::placeholder {
            color: var(--text-placeholder);
        }

        .due-date-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .due-date-row label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .due-date-row input[type="date"] {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.85rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.3s ease;
            flex: 1;
            max-width: 200px;
        }

        .due-date-row input[type="date"]:focus {
            border-color: var(--accent);
        }

        .btn-add {
            padding: 14px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .todo-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .filters {
            display: flex;
            gap: 4px;
            background: var(--filter-bg);
            border-radius: 10px;
            padding: 4px;
        }

        .filter-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--filter-active-bg);
            color: var(--filter-active-text);
        }

        .filter-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .btn-clear {
            padding: 6px 14px;
            border: 2px solid var(--danger);
            background: transparent;
            color: var(--danger);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: var(--danger);
            color: white;
        }

        .todo-list {
            list-style: none;
            min-height: 100px;
        }

        .todo-item {
            background: var(--todo-bg);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
            cursor: grab;
            position: relative;
        }

        .todo-item:hover {
            box-shadow: var(--shadow-hover);
            background: var(--todo-hover);
        }

        .todo-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            cursor: grabbing;
        }

        .todo-item.drag-over {
            background: var(--drag-bg);
            border: 2px dashed var(--accent);
            padding: 12px 14px;
        }

        .todo-item.removing {
            animation: slideOut 0.3s ease forwards;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--completed-text);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .custom-checkbox {
            position: relative;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 1;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .custom-checkbox input:checked + .checkmark {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkmark::after {
            content: '✓';
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .custom-checkbox input:checked + .checkmark::after {
            opacity: 1;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-text {
            font-size: 0.95rem;
            word-break: break-word;
            cursor: text;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .todo-text:hover {
            background: rgba(108, 92, 231, 0.05);
        }

        .todo-due {
            font-size: 0.75rem;
            margin-top: 4px;
            font-weight: 500;
        }

        .todo-due.overdue {
            color: var(--due-overdue);
        }

        .todo-due.today {
            color: var(--due-today);
        }

        .todo-due.upcoming {
            color: var(--due-upcoming);
        }

        .todo-edit-input {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
        }

        .edit-due-input {
            padding: 4px 8px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            font-size: 0.8rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            margin-left: 8px;
        }

        .todo-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }

        .todo-item:hover .todo-actions,
        .todo-item:focus-within .todo-actions {
            opacity: 1;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent);
        }

        .btn-icon.delete:hover {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
        }

        .btn-icon.save {
            color: var(--success);
        }

        .btn-icon.save:hover {
            background: rgba(39, 174, 96, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-placeholder);
            font-size: 1rem;
            flex-shrink: 0;
            user-select: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .todo-item:hover .drag-handle {
            opacity: 1;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #fd79a8);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: var(--text-placeholder);
            font-size: 0.8rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            header h1 {
                font-size: 2rem;
            }

            .input-row {
                flex-direction: column;
            }

            .btn-add {
                width: 100%;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filters {
                justify-content: center;
            }

            .btn-clear {
                text-align: center;
            }

            .todo-actions {
                opacity: 1;
            }

            .drag-handle {
                opacity: 0.5;
            }

            .todo-count {
                text-align: center;
            }

            .due-date-row input[type="date"] {
                max-width: none;
            }
        }

        /* Focus styles for accessibility */
        *:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-add:focus-visible,
        .filter-btn:focus-visible,
        .btn-clear:focus-visible,
        .btn-icon:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Todo App</h1>
            <p>Stay organized, get things done</p>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
                🌙
            </button>
        </header>

        <section class="input-section" aria-label="Add new todo">
            <div class="input-row">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="What needs to be done?" 
                    aria-label="Todo text"
                    autocomplete="off"
                >
                <button class="btn-add" id="addBtn" aria-label="Add todo">Add</button>
            </div>
            <div class="due-date-row">
                <label for="dueDateInput">📅 Due date:</label>
                <input type="date" id="dueDateInput" aria-label="Due date">
            </div>
        </section>

        <div class="progress-bar" aria-label="Completion progress">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <div class="controls">
            <span class="todo-count" id="todoCount" aria-live="polite">0 items left</span>
            <div class="filters" role="group" aria-label="Filter todos">
                <button class="filter-btn active" data-filter="all" aria-label="Show all todos">All</button>
                <button class="filter-btn" data-filter="active" aria-label="Show active todos">Active</button>
                <button class="filter-btn" data-filter="completed" aria-label="Show completed todos">Completed</button>
            </div>
            <button class="btn-clear" id="clearCompleted" aria-label="Clear completed todos">Clear Completed</button>
        </div>

        <ul class="todo-list" id="todoList" role="list" aria-label="Todo items">
        </ul>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="emoji">📝</div>
            <p>No todos yet. Add one above!</p>
        </div>

        <footer>
            <p>Double-click to edit • Drag to reorder • Data saved locally</p>
        </footer>
    </div>

    <script>
        if(localStorage.getItem("loggedIn") !== "true"){
            window.location.href = "index.html";
    }   
        // ===== State =====
        let todos = [];
        let currentFilter = 'all';
        let draggedItem = null;
        let draggedIndex = null;

        // ===== DOM Elements =====
        const todoInput = document.getElementById('todoInput');
        const dueDateInput = document.getElementById('dueDateInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const todoCount = document.getElementById('todoCount');
        const clearCompletedBtn = document.getElementById('clearCompleted');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const themeToggle = document.getElementById('themeToggle');
        const progressFill = document.getElementById('progressFill');
        const emptyState = document.getElementById('emptyState');

        // ===== LocalStorage =====
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function loadTodos() {
            const stored = localStorage.getItem('todos');
            if (stored) {
                todos = JSON.parse(stored);
            }
        }

        function saveTheme(theme) {
            localStorage.setItem('theme', theme);
        }

        function loadTheme() {
            return localStorage.getItem('theme') || 'light';
        }

        // ===== Theme =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            saveTheme(theme);
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ===== Todo CRUD =====
        function generateId() {
            return crypto.randomUUID();
        }

        function addTodo(text, dueDate) {
            text = text.trim();
            if (text.trim() === "") {
            alert("Enter a task");
            return;
        }

            const todo = {
                id: generateId(),
                text: text,
                completed: false,
                dueDate: dueDate || null,
                createdAt: Date.now()
            };

            todos.unshift(todo);
            saveTodos();
            render();
        }

        function deleteTodo(id) {
            const itemEl = document.querySelector(`[data-id="${id}"]`);
            if (itemEl) {
                itemEl.classList.add('removing');
                setTimeout(() => {
                    todos = todos.filter(t => t.id !== id);
                    saveTodos();
                    render();
                }, 300);
            }
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                render();
            }
        }

        function editTodo(id, newText, newDueDate) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                const trimmed = newText.trim();
                if (trimmed) {
                    todo.text = trimmed;
                }
                if (newDueDate !== undefined) {
                    todo.dueDate = newDueDate || null;
                }
                saveTodos();
                render();
            }
        }

        function clearCompleted() {
            const completedEls = document.querySelectorAll('.todo-item.completed');
            completedEls.forEach(el => el.classList.add('removing'));
            setTimeout(() => {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                render();
            }, 300);
        }

        // ===== Filtering =====
        function getFilteredTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(t => !t.completed);
                case 'completed':
                    return todos.filter(t => t.completed);
                default:
                    return todos;
            }
        }

        // ===== Due Date Helpers =====
        function getDueDateInfo(dateStr) {
            if (!dateStr) return null;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dueDate = new Date(dateStr);
            const diffTime = dueDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const options = { month: 'short', day: 'numeric' };
            const formatted = dueDate.toLocaleDateString(undefined, options);

            if (diffDays < 0) {
                return { text: `Overdue: ${formatted}`, className: 'overdue' };
            } else if (diffDays === 0) {
                return { text: `Due today`, className: 'today' };
            } else if (diffDays === 1) {
                return { text: `Due tomorrow`, className: 'upcoming' };
            } else if (diffDays <= 7) {
                return { text: `Due in ${diffDays} days`, className: 'upcoming' };
            } else {
                return { text: `Due ${formatted}`, className: 'upcoming' };
            }
        }

        // ===== Render =====
        function render() {
            const filtered = getFilteredTodos();
            todoList.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                if (currentFilter === 'active') {
                    emptyState.querySelector('.emoji').textContent = '🎉';
                    emptyState.querySelector('p').textContent = 'All tasks completed!';
                } else if (currentFilter === 'completed') {
                    emptyState.querySelector('.emoji').textContent = '📋';
                    emptyState.querySelector('p').textContent = 'No completed tasks yet.';
                } else {
                    emptyState.querySelector('.emoji').textContent = '📝';
                    emptyState.querySelector('p').textContent = 'No todos yet. Add one above!';
                }
            } else {
                emptyState.style.display = 'none';
            }

            filtered.forEach((todo, index) => {
                const li = createTodoElement(todo, index);
                todoList.appendChild(li);
            });

            updateCount();
            updateProgress();
        }

        function createTodoElement(todo) {
            const li = document.createElement('li');
            li.className = `todo-item${todo.completed ? ' completed' : ''}`;
            li.setAttribute('data-id', todo.id);
            li.setAttribute('role', 'listitem');
            li.setAttribute('draggable', 'true');

            // Drag handle
            const dragHandle = document.createElement('span');
            dragHandle.className = 'drag-handle';
            dragHandle.textContent = '⠿';
            dragHandle.setAttribute('aria-hidden', 'true');

            // Checkbox
            const checkLabel = document.createElement('label');
            checkLabel.className = 'custom-checkbox';
            const checkInput = document.createElement('input');
            checkInput.type = 'checkbox';
            checkInput.checked = todo.completed;
            checkInput.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'incomplete' : 'complete'}`);
            checkInput.addEventListener('change', () => toggleTodo(todo.id));
            const checkmark = document.createElement('span');
            checkmark.className = 'checkmark';
            checkLabel.appendChild(checkInput);
            checkLabel.appendChild(checkmark);

            // Content area
            const contentDiv = document.createElement('div');
            contentDiv.className = 'todo-content';

            const textSpan = document.createElement('span');
            textSpan.className = 'todo-text';
            textSpan.textContent = todo.text;

            // Double-click to edit
            textSpan.addEventListener('dblclick', () => startEditing(todo.id));

            contentDiv.appendChild(textSpan);

            // Due date display
            const dueDateInfo = getDueDateInfo(todo.dueDate);
            if (dueDateInfo) {
                const dueSpan = document.createElement('div');
                dueSpan.className = `todo-due ${dueDateInfo.className}`;
                dueSpan.textContent = dueDateInfo.text;
                contentDiv.appendChild(dueSpan);
            }

            // Actions
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'todo-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-icon edit';
            editBtn.innerHTML = '✏️';
            editBtn.setAttribute('aria-label', `Edit "${todo.text}"`);
            editBtn.addEventListener('click', () => startEditing(todo.id));

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-icon delete';
            deleteBtn.innerHTML = '🗑️';
            deleteBtn.setAttribute('aria-label', `Delete "${todo.text}"`);
            deleteBtn.addEventListener('click', () => {
    if (confirm("Delete this task?")) {
        deleteTodo(todo.id);
    }
});
            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(deleteBtn);

            li.appendChild(dragHandle);
            li.appendChild(checkLabel);
            li.appendChild(contentDiv);
            li.appendChild(actionsDiv);

            // Drag events
            setupDragEvents(li, todo.id);

            return li;
        }

        function startEditing(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            const li = document.querySelector(`[data-id="${id}"]`);
            if (!li) return;

            const contentDiv = li.querySelector('.todo-content');
            const actionsDiv = li.querySelector('.todo-actions');

            // Replace content with edit input
            contentDiv.innerHTML = '';

            const editInput = document.createElement('input');
            editInput.type = 'text';
            editInput.className = 'todo-edit-input';
            editInput.value = todo.text;
            editInput.setAttribute('aria-label', 'Edit todo text');

            const editDueInput = document.createElement('input');
            editDueInput.type = 'date';
            editDueInput.className = 'edit-due-input';
            editDueInput.value = todo.dueDate || '';
            editDueInput.setAttribute('aria-label', 'Edit due date');

            contentDiv.appendChild(editInput);
            contentDiv.appendChild(editDueInput);

            // Replace actions with save/cancel
            actionsDiv.innerHTML = '';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn-icon save';
            saveBtn.innerHTML = '✅';
            saveBtn.setAttribute('aria-label', 'Save changes');

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-icon';
            cancelBtn.innerHTML = '❌';
            cancelBtn.setAttribute('aria-label', 'Cancel editing');

            const saveEdit = () => {
                editTodo(id, editInput.value, editDueInput.value);
            };

            const cancelEdit = () => {
                render();
            };

            saveBtn.addEventListener('click', saveEdit);
            cancelBtn.addEventListener('click', cancelEdit);

            editInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveEdit();
                if (e.key === 'Escape') cancelEdit();
            });

            editDueInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveEdit();
                if (e.key === 'Escape') cancelEdit();
            });

            actionsDiv.appendChild(saveBtn);
            actionsDiv.appendChild(cancelBtn);

            editInput.focus();
            editInput.select();
        }

        function updateCount() {
            const activeCount = todos.filter(t => !t.completed).length;
            todoCount.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;
        }

        function updateProgress() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const percent = total > 0 ? (completed / total) * 100 : 0;
            progressFill.style.width = `${percent}%`;
        }

        // ===== Drag and Drop =====
        function setupDragEvents(li, todoId) {
            li.addEventListener('dragstart', (e) => {
                draggedItem = li;
                draggedIndex = todos.findIndex(t => t.id === todoId);
                li.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', todoId);
            });

            li.addEventListener('dragend', () => {
                li.classList.remove('dragging');
                document.querySelectorAll('.todo-item').forEach(item => {
                    item.classList.remove('drag-over');
                });
                draggedItem = null;
                draggedIndex = null;
            });

            li.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (draggedItem && draggedItem !== li) {
                    li.classList.add('drag-over');
                }
            });

            li.addEventListener('dragleave', () => {
                li.classList.remove('drag-over');
            });

            li.addEventListener('drop', (e) => {
                e.preventDefault();
                li.classList.remove('drag-over');

                if (!draggedItem || draggedItem === li) return;

                const dropId = li.getAttribute('data-id');
                const dropIndex = todos.findIndex(t => t.id === dropId);

                if (draggedIndex !== null && dropIndex !== -1 && draggedIndex !== dropIndex) {
                    const [movedTodo] = todos.splice(draggedIndex, 1);
                    todos.splice(dropIndex, 0, movedTodo);
                    saveTodos();
                    render();
                }
            });

            // Touch drag support
            let touchStartY = 0;
            let touchClone = null;

            li.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const touch = e.touches[0];
                touchStartY = touch.clientY;

                // Long press to initiate drag
                li._longPressTimer = setTimeout(() => {
                    draggedItem = li;
                    draggedIndex = todos.findIndex(t => t.id === todoId);
                    li.classList.add('dragging');
                }, 500);
            }, { passive: true });

            li.addEventListener('touchmove', (e) => {
                clearTimeout(li._longPressTimer);
                if (!draggedItem || draggedItem !== li) return;

                const touch = e.touches[0];
                const elements = document.elementsFromPoint(touch.clientX, touch.clientY);
                const dropTarget = elements.find(el => el.classList && el.classList.contains('todo-item') && el !== li);

                document.querySelectorAll('.todo-item').forEach(item => item.classList.remove('drag-over'));
                if (dropTarget) {
                    dropTarget.classList.add('drag-over');
                }
            }, { passive: true });

            li.addEventListener('touchend', (e) => {
                clearTimeout(li._longPressTimer);
                if (!draggedItem || draggedItem !== li) return;

                const touch = e.changedTouches[0];
                const elements = document.elementsFromPoint(touch.clientX, touch.clientY);
                const dropTarget = elements.find(el => el.classList && el.classList.contains('todo-item') && el !== li);

                if (dropTarget) {
                    const dropId = dropTarget.getAttribute('data-id');
                    const dropIdx = todos.findIndex(t => t.id === dropId);

                    if (draggedIndex !== null && dropIdx !== -1) {
                        const [movedTodo] = todos.splice(draggedIndex, 1);
                        todos.splice(dropIdx, 0, movedTodo);
                        saveTodos();
                    }
                }

                li.classList.remove('dragging');
                document.querySelectorAll('.todo-item').forEach(item => item.classList.remove('drag-over'));
                draggedItem = null;
                draggedIndex = null;
                render();
            });
        }

        // ===== Event Listeners =====
        addBtn.addEventListener('click', () => {
            addTodo(todoInput.value, dueDateInput.value);
            todoInput.value = '';
            dueDateInput.value = '';
            todoInput.focus();
        });

        todoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addTodo(todoInput.value, dueDateInput.value);
                todoInput.value = '';
                dueDateInput.value = '';
            }
        });

        clearCompletedBtn.addEventListener('click', () => {
    if(confirm("Delete all completed tasks?")){
        clearCompleted();
    }
});

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                render();
            });
        });

        // ===== Initialize =====
        function init() {
            const theme = loadTheme();
            setTheme(theme);
            loadTodos();
            render();
            todoInput.focus();
        }

        init();
    </script>
</body>
</html>
