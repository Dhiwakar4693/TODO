<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#6c5ce7,#a29bfe);
        }

        .login-card{
            background:white;

            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            width:350px;
        }

            margin-bottom:10px;

        }

            margin-bottom:25px;

<body>

<div class="login-card">

    <h1>Todo App</h1>
    <p>Sign in with Google to continue</p>

    <div id="googleSignInDiv"></div>

    <div class="user-info" id="userInfo">
        <img id="userPic" src="" alt="Profile">
        <h3 id="userName"></h3>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

</div>

<script>

function parseJwt(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(
        atob(base64)
        .split('')
        .map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        })
        .join('')
    );

    return JSON.parse(jsonPayload);
}

function handleCredentialResponse(response) {

    const data = parseJwt(response.credential);

    localStorage.setItem("userName", data.name);
    localStorage.setItem("userEmail", data.email);
    localStorage.setItem("userPic", data.picture);
    localStorage.setItem("loggedIn", "true");

    window.location.href = "todo.html";
}

window.onload = function () {

    if(localStorage.getItem("loggedIn") === "true"){
        window.location.href = "todo.html";
    }

    google.accounts.id.initialize({
        client_id: "196621314027-hibij3ivujctjmme21rhfc3dgrbek14s.apps.googleusercontent.com",
        callback: handleCredentialResponse
    });

    google.accounts.id.renderButton(
        document.getElementById("googleSignInDiv"),
        {
            theme: "outline",
            size: "large",
            width: 280
        }
    );
}

function logout(){
    localStorage.clear();
    location.reload();
}

</script>

</body>
</html>

<div id="loginSection">

<div
id="g_id_onload"
data-client_id="196621314027-hibij3ivujctjmme21rhfc3dgrbek14s.apps.googleusercontent.com"
data-context="signin"
data-callback="handleCredentialResponse"
data-auto_prompt="false">
</div>

<div
class="g_id_signin"
data-type="standard"

</div>

</div>

<div id="profileSection" class="profile">

<h2 id="userName"></h2>

Open Todo App
</button>

<br><br>

Logout
</button>

<div class="footer">
Google Identity Services Login
</div>

</div>

<script>

function parseJwt(token){
return JSON.parse(
atob(token.split('.')[1])
);
}

function handleCredentialResponse(response){

const user=parseJwt(response.credential);

localStorage.setItem("loggedIn","true");
localStorage.setItem("userName",user.name);
localStorage.setItem("userEmail",user.email);
localStorage.setItem("userPicture",user.picture);

showProfile();
}

function showProfile(){

const loggedIn=localStorage.getItem("loggedIn");

if(loggedIn==="true"){

document.getElementById("loginSection").style.display="none";

document.getElementById("profileSection").style.display="block";

document.getElementById("userName").textContent=
localStorage.getItem("userName");

document.getElementById("userEmail").textContent=
localStorage.getItem("userEmail");

document.getElementById("userPic").src=
localStorage.getItem("userPicture");

}else{

document.getElementById("loginSection").style.display="block";

document.getElementById("profileSection").style.display="none";

}
}

function logout(){

localStorage.removeItem("loggedIn");
localStorage.removeItem("userName");
localStorage.removeItem("userEmail");
localStorage.removeItem("userPicture");

location.reload();
}

function goToTodo(){

window.location.href="todo.html";

}

showProfile();

</script>

</body>
</html>
