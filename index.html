<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlowTodo Login</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,#e9f0fc 0%,#d9e3f0 100%);
    padding:20px;
}

.login-card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,0.95);
    border-radius:32px;
    padding:50px 40px;
    text-align:center;
    box-shadow:
        0 25px 45px rgba(0,0,0,0.15),
        0 5px 15px rgba(0,0,0,0.05);
}

.logo{
    font-size:2.4rem;
    font-weight:700;
    color:#1f2b48;
    margin-bottom:10px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    color:#64748b;
    font-size:15px;
    margin-bottom:35px;
    line-height:1.6;
}

.feature-box{
    background:#f8fbff;
    border:1px solid #e5edf8;
    border-radius:20px;
    padding:18px;
    margin-bottom:30px;
}

.feature-box p{
    color:#475569;
    font-size:14px;
    line-height:1.6;
}

.google-login{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.footer-text{
    margin-top:30px;
    font-size:13px;
    color:#94a3b8;
}

.loading{
    display:none;
    margin-top:20px;
    color:#2563eb;
    font-weight:600;
}

@media(max-width:500px){

    .login-card{
        padding:40px 25px;
        border-radius:24px;
    }

    .logo{
        font-size:2rem;
    }
}
</style>
</head>

<body>
    

<div class="login-card">

    <div class="logo">
        ✓ <span>FlowTodo</span>
    </div>

    <div class="subtitle">
        Sign in with your Google account and start managing your tasks beautifully.
    </div>

    <div class="feature-box">
        <p>
            ✔ Organize tasks<br>
            ✔ Track progress<br>
            ✔ Auto-save in browser<br>
            ✔ Clean and distraction-free workspace
        </p>
    </div>

    <!-- Google Sign In -->

    <div id="g_id_onload"
         data-client_id="196621314027-hibij3ivujctjmme21rhfc3dgrbek14s.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>

    <div class="google-login">
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="pill"
             data-logo_alignment="left">
        </div>
    </div>

    <div class="loading" id="loading">
        Signing you in...
    </div>

    <div class="footer-text">
        Your tasks stay private and are stored locally on your device.
    </div>

</div>

<script>

function handleCredentialResponse(response){

    document.getElementById("loading").style.display = "block";

    localStorage.setItem("loggedIn","true");

    setTimeout(() => {
        window.location.href = "todo.html";
    },1000);
}

if(localStorage.getItem("loggedIn") === "true"){
    window.location.href = "todo.html";
}

</script>

</body>
</html>
