<!DOCTYPE html>



<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlowTodo | Sign In</title>



<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}



body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(145deg,#e9f0fc,#d9e3f0);

    font-family:'Inter',sans-serif;

    padding:20px;

}



.login-card{

    width:100%;

    max-width:430px;

    background:white;

    border-radius:30px;

    padding:40px;

    box-shadow:0 20px 40px rgba(0,0,0,0.12);

}



.logo{

    text-align:center;

    margin-bottom:30px;

}



.logo h1{

    font-size:2rem;

    color:#1f2b48;

}



.logo p{

    color:#64748b;

    margin-top:8px;

}



.form-group{

    margin-bottom:20px;

}



.form-group label{

    display:block;

    margin-bottom:8px;

    color:#334155;

    font-weight:600;

}



.form-group input{

    width:100%;

    padding:14px 18px;

    border:1.5px solid #dbe3ef;

    border-radius:16px;

    font-size:15px;

    outline:none;

    transition:0.3s;

}



.form-group input:focus{

    border-color:#3b82f6;

    box-shadow:0 0 0 4px rgba(59,130,246,0.15);

}



.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:18px;

    background:linear-gradient(135deg,#3b82f6,#2563eb);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

}



.login-btn:hover{

    transform:translateY(-2px);

}



.note{

    text-align:center;

    margin-top:20px;

    color:#64748b;

    font-size:14px;

}

</style>



</head>



<body>

<div class="login-card">

<div class="logo">

    <h1>✓ FlowTodo</h1>

    <p>Sign in to continue</p>

</div>



<form id="loginForm">



    <div class="form-group">

        <label>Email Address</label>

        <input

            type="email"

            id="email"

            placeholder="you@example.com"

            required

        >

    </div>



    <div class="form-group">

        <label>Password</label>

        <input

            type="password"

            id="password"

            placeholder="••••••••"

            required

        >

    </div>



    <button type="submit" class="login-btn">

        Sign In

    </button>



</form>



<div class="note">

    Your tasks are stored separately for each email.

</div>



</div>



<script>

    console.log("INDEX PAGE");
    console.log("loggedIn =", localStorage.getItem("loggedIn"));

    if(localStorage.getItem("loggedIn") === "true"){
        window.location.href = "todo.html";
    }
    
document.getElementById("loginForm").addEventListener("submit", function(e){



    e.preventDefault();



    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value.trim();



    if(email === "" || password === ""){

        alert("Please fill all fields");

        return;

    }



    localStorage.setItem("loggedIn","true");

    localStorage.setItem("currentUser", email);



    window.location.href = "todo.html";



});



</script>



</body>

</html>
