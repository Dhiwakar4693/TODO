<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowTodo Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(145deg,#e9f0fc,#d9e3f0);
}

.card{
background:white;
padding:40px;
border-radius:20px;
width:380px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
color:#2563eb;
margin-bottom:10px;
}

p{
color:#64748b;
margin-bottom:25px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

img{
width:70px;
height:70px;
border-radius:50%;
margin-bottom:15px;
display:none;
}

#userName{
margin-bottom:20px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<img id="userPhoto">

<h1>FlowTodo</h1>

<p id="userName">
Sign in with Google
</p>

<button id="loginBtn">
Continue with Google
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDp1nDWAhhORIXgflU70-HfW4QchoEFru0",
authDomain: "todo-f8e84.firebaseapp.com",
projectId: "todo-f8e84",
storageBucket: "todo-f8e84.firebasestorage.app",
messagingSenderId: "551875020073",
appId: "1:551875020073:web:fb71bc9d159ae8f1bb2338",
measurementId: "G-EREVQ5HX4D"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

document.getElementById("loginBtn")
.addEventListener("click", async () => {

try{

await signInWithPopup(auth, provider);

window.location.href = "todo.html";

}catch(err){

alert(err.message);

}

});

onAuthStateChanged(auth, (user)=>{

if(user){

window.location.href = "todo.html";

}

});

</script>

</body>
</html>
